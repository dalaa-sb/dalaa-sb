name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4F46E5&color_dots=#EBEDF0,#E0E7FF,#A5B4FC,#818CF8,#4F46E5
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#312E81,#4F46E5,#818CF8,#C7D2FE

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
